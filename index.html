<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prince Jezreel Galang | CV</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f4; }

    a.btn { background: #e91e63; color: #fff; padding: 8px 14px;

  </style>
</head>

  <header>
    <span>Prince Jezreel Galang, CV</span>
    <a class="btn" href="cv.pdf" download>Download PDF</a>

</body>
